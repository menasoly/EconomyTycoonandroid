# Machine-readable architecture manifest. Authoritative for module ids and dependencies.
version: 1
base_package: app.many.economytycoon
rules:
  - no_cycles
  - simulation_domains_must_not_import_android
  - dependencies_only_as_listed
modules:
  core:        { path: core,          depends_on: [],                                         owner: engine-core,   priority: 1 }
  infra:       { path: infra,         depends_on: [],                                         owner: platform,      priority: 1 }
  content:     { path: content,       depends_on: [core],                                     owner: content,       priority: 2 }
  finance:     { path: finance,       depends_on: [core],                                     owner: economy,       priority: 2 }
  world:       { path: world,         depends_on: [core, content],                            owner: world,         priority: 3 }
  workforce:   { path: workforce,     depends_on: [core, finance],                            owner: operations,    priority: 3 }
  production:  { path: production,    depends_on: [core, content, workforce],                 owner: operations,    priority: 3 }
  markets:     { path: markets,       depends_on: [core, content, world, finance],            owner: economy,       priority: 3 }
  logistics:   { path: logistics,     depends_on: [core, world, production, markets],         owner: operations,    priority: 4 }
  companies:   { path: companies,     depends_on: [core, content, finance],                   owner: economy,       priority: 4 }
  macro:       { path: macro,         depends_on: [core, markets, finance, world],            owner: economy,       priority: 5 }
  competitors: { path: competitors,   depends_on: [core, companies, markets, production, logistics], owner: ai,    priority: 5 }
  simulation:  { path: simulation,    depends_on: [core, finance, world, workforce, production, markets, logistics, companies, macro, competitors], owner: engine-core, priority: 4 }
  persistence: { path: persistence,   depends_on: [core, simulation, infra],                  owner: data,         priority: 4 }
  session:     { path: session,       depends_on: [simulation, persistence, infra],           owner: app,          priority: 5 }
  ui:          { path: ui,            depends_on: [session, infra],                           owner: app,          priority: 5 }
  visualization: { path: visualization, depends_on: [session],                                owner: app,          priority: 6 }
  blueprint:   { path: blueprint, depends_on: [core, content, world, workforce, production, companies, facilityprofit, simulation, session, persistence], owner: app, priority: 6 }
  marketing:   { path: marketing, depends_on: [core, content, finance, markets, world, advisor], owner: economy, priority: 5 }
  energygrid:  { path: energygrid, depends_on: [core, finance, world], owner: economy, priority: 5 }
  net:         { path: net, depends_on: [core, content, finance, companies, persistence, simulation, replay], owner: platform, priority: 6 }
  carbon:      { path: carbon, depends_on: [core, content, finance, production, advisor], owner: economy, priority: 6 }
  banking:     { path: banking, depends_on: [core, finance], owner: economy, priority: 5 }
tick_phases:
  - begin_tick
  - scheduled_events
  - decisions
  - command_application
  - resource_availability
  - procurement_and_shipments
  - production
  - demand
  - market_clearing
  - fulfillment
  - financial_settlement
  - workforce_update
  - macro_update
  - invariant_checks
  - publish
adrs: [ADR-0001, ADR-0002, ADR-0003, ADR-0004, ADR-0005, ADR-0006, ADR-0007, ADR-0008, ADR-0009, ADR-0010, ADR-0011, ADR-0012, ADR-0013]
